name: Verify

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: "30 4 * * *"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: current
      - run: npm install
      - run: npm run build

  validate:
    name: Validate
    runs-on: ubuntu-latest
    if: ${{ always() }}

    needs:
      - build

    steps:
      - name: Check validation results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" | jq -e 'all(.result == "success")'
